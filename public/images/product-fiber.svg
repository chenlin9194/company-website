<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Fiber optic lines -->
  <g transform="translate(80,80)" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.9">
    <path d="M0,70 Q30,30 60,70 Q90,110 120,70 Q150,30 180,70 Q210,110 240,70"/>
  </g>
  <g transform="translate(80,100)" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.7">
    <path d="M0,70 Q30,30 60,70 Q90,110 120,70 Q150,30 180,70 Q210,110 240,70"/>
  </g>
  <g transform="translate(80,120)" stroke="#bfdbfe" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M0,70 Q30,30 60,70 Q90,110 120,70 Q150,30 180,70 Q210,110 240,70"/>
  </g>
  <!-- Light pulse -->
  <circle cx="160" cy="170" r="3" fill="#fbbf24" opacity="0.8">
    <animate attributeName="cx" values="80;320" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Fiber icon -->
  <text x="200" y="250" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" opacity="0.6">Fiber Optic</text>
</svg>
