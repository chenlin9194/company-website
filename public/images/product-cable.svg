<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Cable cross section -->
  <g transform="translate(200,120)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#bfdbfe" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="#fbbf24" opacity="0.8"/>
    <!-- Inner strands -->
    <circle cx="25" cy="0" r="6" fill="#60a5fa" opacity="0.7"/>
    <circle cx="-25" cy="0" r="6" fill="#60a5fa" opacity="0.7"/>
    <circle cx="0" cy="25" r="6" fill="#60a5fa" opacity="0.7"/>
    <circle cx="0" cy="-25" r="6" fill="#60a5fa" opacity="0.7"/>
    <circle cx="18" cy="18" r="5" fill="#60a5fa" opacity="0.5"/>
    <circle cx="-18" cy="-18" r="5" fill="#60a5fa" opacity="0.5"/>
    <circle cx="-18" cy="18" r="5" fill="#60a5fa" opacity="0.5"/>
    <circle cx="18" cy="-18" r="5" fill="#60a5fa" opacity="0.5"/>
  </g>
  <text x="200" y="250" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" opacity="0.6">Power Cable</text>
</svg>
